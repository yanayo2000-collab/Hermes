services:
  - type: web
    name: mcn-whatsapp-webhook
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.official_webhook_bridge_app:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
