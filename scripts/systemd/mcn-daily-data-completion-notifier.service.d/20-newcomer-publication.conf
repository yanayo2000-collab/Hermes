[Service]
EnvironmentFile=-/etc/mcn-ai-automation/newcomer-publication.env
# Drain the durable newcomer outbox after the existing five-task notifier.
# A delivery failure remains in the outbox for the next five-minute cycle and
# must not erase the already completed MCN publication.
ExecStartPost=-/opt/mcn-ai-automation/.venv/bin/python /opt/mcn-ai-automation/scripts/notify_newcomer_publications.py
