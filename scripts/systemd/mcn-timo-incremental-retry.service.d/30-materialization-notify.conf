[Service]
ExecStartPre=/usr/bin/mkdir -p /run/mcn-ai-automation
ExecStartPre=/usr/bin/touch /run/mcn-ai-automation/timo-incremental-retry.started
ExecStartPost=-/opt/mcn-ai-automation/.venv/bin/python /opt/mcn-ai-automation/scripts/notify_timo_materialization.py --status-path /opt/mcn-ai-automation/data/timo_incremental_retry_status.json --started-marker /run/mcn-ai-automation/timo-incremental-retry.started
