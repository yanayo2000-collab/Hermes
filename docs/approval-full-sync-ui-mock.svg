<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#17304d" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg{fill:#f4f7fb}.panel{fill:#fff;stroke:#e5ebf3;stroke-width:1}.muted{fill:#718198;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.text{fill:#172033;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{fill:#172033;font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h2{fill:#172033;font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h3{fill:#172033;font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{fill:#718198;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.value{fill:#172033;font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{fill:#8a98aa;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.chip{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.btn{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.nav{fill:#5c6f88;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.nav-active{fill:#fff;font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1440" height="960"/>

  <!-- fixed left nav: same as current 群审批控制台 shell -->
  <rect x="24" y="24" width="248" height="912" rx="28" class="panel" filter="url(#shadow)"/>
  <text x="48" y="64" class="h2">MCN 客服工具</text>
  <g transform="translate(40 96)">
    <text x="30" y="23" class="nav">管理员看板</text><circle cx="12" cy="18" r="4" fill="#b7c4d4"/>
    <text x="30" y="67" class="nav">绑定中心</text><circle cx="12" cy="62" r="4" fill="#b7c4d4"/>
    <rect x="0" y="88" width="200" height="42" rx="14" fill="#2f7df6"/>
    <circle cx="18" cy="109" r="4" fill="#fff"/><text x="36" y="114" class="nav-active">群审批控制台</text>
    <text x="30" y="163" class="nav">注册群审批留存页</text><circle cx="12" cy="158" r="4" fill="#b7c4d4"/>
    <text x="30" y="207" class="nav">群聊天助手</text><circle cx="12" cy="202" r="4" fill="#b7c4d4"/>
    <text x="30" y="251" class="nav">账号设置</text><circle cx="12" cy="246" r="4" fill="#b7c4d4"/>
  </g>

  <!-- content column keeps current measured x=304, width=952, 16px section gap -->
  <g transform="translate(304 24)">
    <!-- merged page head + overview, based on current top cards -->
    <rect x="0" y="0" width="952" height="322" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="24" y="45" class="title">群审批控制台</text>
    <text x="24" y="70" class="muted">注册群 / 官方群统一看状态，账号配置在下方统一维护</text>
    <rect x="720" y="22" width="104" height="38" rx="12" fill="#eef4ff" stroke="#cfe0ff"/>
    <text x="742" y="46" class="chip" fill="#2f65d8">同步状态</text>
    <rect x="836" y="22" width="92" height="38" rx="12" fill="#2f7df6"/>
    <text x="855" y="46" class="btn" fill="#fff">刷新</text>

    <!-- left approval card -->
    <g transform="translate(20 96)">
      <rect x="0" y="0" width="447" height="204" rx="22" class="panel"/>
      <text x="20" y="34" class="h2">注册群审批</text>
      <rect x="322" y="16" width="92" height="30" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="344" y="36" class="chip" fill="#c66a12">未配置</text>
      <rect x="20" y="58" width="407" height="126" rx="18" fill="#fbfdff" stroke="#e5ebf3"/>
      <g transform="translate(40 84)">
        <text class="label" x="0" y="0">待审批人数</text><text class="value" x="0" y="28">-</text>
        <text class="label" x="128" y="0">今日已通过</text><text class="value" x="128" y="28">0</text>
        <text class="label" x="256" y="0">审批账号</text><text class="value" x="256" y="28">0 个配置</text>
        <text class="label" x="0" y="66">统计范围</text><text class="text" x="0" y="94">0 个账号 / 0 个群</text>
        <text class="label" x="190" y="66">最近检查</text><text class="text" x="190" y="94">5-18 18:42</text>
        <rect x="314" y="73" width="58" height="26" rx="13" fill="#ecfdf3" stroke="#bbf7d0"/>
        <text x="326" y="91" class="chip" fill="#16834a">无异常</text>
      </g>
    </g>

    <!-- official approval card -->
    <g transform="translate(485 96)">
      <rect x="0" y="0" width="447" height="204" rx="22" class="panel"/>
      <text x="20" y="34" class="h2">官方群审批</text>
      <rect x="322" y="16" width="92" height="30" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="344" y="36" class="chip" fill="#c66a12">未配置</text>
      <rect x="20" y="58" width="407" height="126" rx="18" fill="#fbfdff" stroke="#e5ebf3"/>
      <g transform="translate(40 84)">
        <text class="label" x="0" y="0">待处理人数</text><text class="value" x="0" y="28">-</text>
        <text class="label" x="128" y="0">今日已通过</text><text class="value" x="128" y="28">0</text>
        <text class="label" x="256" y="0">审批账号</text><text class="value" x="256" y="28">0 个配置</text>
        <text class="label" x="0" y="66">最近检查</text><text class="text" x="0" y="94">-</text>
        <text class="label" x="190" y="66">异常提示</text>
        <rect x="190" y="73" width="58" height="26" rx="13" fill="#ecfdf3" stroke="#bbf7d0"/>
        <text x="202" y="91" class="chip" fill="#16834a">无异常</text>
      </g>
    </g>
  </g>

  <g transform="translate(304 362)">
    <rect x="0" y="0" width="952" height="212" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="24" y="43" class="h2">WhatsApp 审批账号</text>
    <text x="24" y="68" class="muted">统一配置注册群 / 官方群审批账号；每个账号绑定客服、地区、群组和登录状态。</text>
    <rect x="748" y="20" width="180" height="42" rx="14" fill="#2f7df6"/>
    <text x="774" y="47" class="btn" fill="#fff">新增 WhatsApp 账号</text>

    <!-- current empty state, strengthened but still same card area -->
    <rect x="24" y="92" width="904" height="96" rx="18" fill="#f8fafc" stroke="#e5ebf3" stroke-dasharray="4 4"/>
    <circle cx="74" cy="140" r="22" fill="#eaf2ff"/>
    <path d="M66 137h16M66 144h12" stroke="#2f7df6" stroke-width="3" stroke-linecap="round"/>
    <text x="112" y="132" class="h3">暂无 WhatsApp 审批账号</text>
    <text x="112" y="158" class="muted">先新增账号，再在弹窗里维护逐群绑定；空状态不再只放一行弱提示。</text>
    <rect x="754" y="119" width="132" height="42" rx="14" fill="#fff" stroke="#cfe0ff"/>
    <text x="782" y="146" class="btn" fill="#2f65d8">立即新增</text>
  </g>

  <g transform="translate(304 606)">
    <rect x="0" y="0" width="952" height="154" rx="24" fill="#fff" stroke="#dbeafe"/>
    <text x="24" y="40" class="h2">这版改造基于当前真实页面</text>
    <text x="24" y="72" class="muted">保留：左侧固定导航、白底卡片、16px 间距、注册群/官方群双卡、下方 WhatsApp 审批账号入口。</text>
    <text x="24" y="104" class="muted">调整：状态做成可扫读标签；顶部补充统一说明和刷新入口；空账号区强化主操作，不凭空换页面结构。</text>
  </g>
</svg>
